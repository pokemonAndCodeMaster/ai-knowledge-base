ct>${['视频理解','文本问答','多模态推理','规则生成','质量解释','数据筛选'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>输入数据集<input value="dataset://quality-check/demo"></label><label>目标数量<input value="10000"></label></div><div class="actions"><button class="btn primary" onclick="this.closest('dialog').close()">创建任务</button></div>`;d.showModal()})}
