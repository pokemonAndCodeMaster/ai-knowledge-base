# TAXONOMY.yaml — 知识库分类法宪法
# 约束所有 Wiki 卡片的 domain 与 type 枚举值
# 演进规则：增删枚举值需人类审批，由 ai-librarian 提案

# ─────────────────────────────────────────
# 业务域 (domain) — 支持跨域复用，卡片中填 List
# ─────────────────────────────────────────
domains:
  - knowledge_mgmt      # 知识管理与记忆系统（LLM Wiki、Zettelkasten 等）
  - learning_methods    # 学习方法论（费曼、主动召回、间隔重复等）
  - agent_engineering   # AI 智能体工程（设计模式、工作流、评估框架等）
  - harness_engineering # Harness 工程（约束基础设施、控制回路、赛博控制论等）
  - tooling             # 开发工具与生态（NotebookLM、Obsidian、QMD 等）
  - ai_dlc              # AI 驱动开发生命周期（AWS AI-DLC、Mob Rituals 等）
  - entity              # 人物、组织、产品的事实性记录（放在 entities/ 下）
  - meta                # 系统自身的元知识（schema、索引、操作指南等）

# ─────────────────────────────────────────
# 知识类型 (type) — 原子性，卡片中填 String
# ─────────────────────────────────────────
types:
  hub:         "枢纽/目录卡——只做导航与索引，不含具体细节，强制使用 [[双链]] 指向子卡"
  schema:      "规范/约定卡——定义本系统的结构规则、命名规范、元数据约定"
  concept:     "概念卡——理论、方法、术语的核心原则（仅本系统如何使用，不写维基百科通用科普）"
  source:      "来源摘要卡——对一篇原始资料的提炼摘要，非全文复制"
  entity:      "实体卡——人物、组织、产品、项目的事实性描述"
  synthesis:   "综合分析卡——跨多来源的主题整合、对比框架、结构化洞察"
  pitfall:     "避坑指南卡——记录曾踩过的坑、反直觉的约束，必须绑定 affects_path"
  norm:        "操作规范卡——强制要求的操作步骤或参数约定，必须绑定 affects_path"
  module_doc:  "模块文档卡——对特定工具/模块的用法文档，与具体代码或配置绑定"
  code_module: "代码模块卡——对特定代码模块/函数/类的结构描述和关键决策记录，必须绑定 related_code 和 code_hash"

# ─────────────────────────────────────────
# 状态枚举 (status)
# ─────────────────────────────────────────
statuses:
  active:      "当前有效，内容与现实一致"
  stale:       "内容可能已过时，等待更新"
  superseded:  "已被新卡片取代，保留作历史参考"
