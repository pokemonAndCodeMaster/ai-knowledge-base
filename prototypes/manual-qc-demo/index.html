<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人工质检一站式平台 · 交互原型</title>
  <style>
    :root {
      --ink: #17212b; --muted: #66737f; --line: #dce3e7; --soft: #f4f7f8;
      --surface: #fff; --nav: #102b32; --nav-2: #173c44; --teal: #0c766e;
      --teal-soft: #e3f3f0; --blue: #315f91; --amber: #a96308; --amber-soft: #fff3dc;
      --red: #a73b3b; --red-soft: #fdeaea; --green: #23704c; --green-soft: #e5f3eb;
      --shadow: 0 8px 24px rgba(28, 50, 57, .08); --radius: 12px;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #edf2f3; font-size: 14px; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,
    [tabindex]:focus-visible { outline: 3px solid rgba(12,118,110,.3); outline-offset: 2px; }
    .skip { position: fixed; top: -50px; left: 12px; z-index: 99; padding: 9px 14px; background: white; color: var(--teal); }
    .skip:focus { top: 10px; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 224px minmax(0,1fr); }
    aside { background: var(--nav); color: #d7e7e8; padding: 22px 14px; position: sticky; top: 0; height: 100vh; }
    .brand { display: flex; gap: 10px; align-items: center; padding: 0 10px 24px; }
    .brand-mark { width: 34px; height: 34px; border: 1px solid #58a69f; display: grid; place-items: center; border-radius: 9px; font-weight: 800; }
    .brand strong { display: block; color: white; font-size: 15px; }
    .brand small { color: #91afb3; }
    nav button { width: 100%; border: 0; color: #b8ced0; background: transparent; display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 8px; text-align: left; margin-bottom: 4px; }
    nav button:hover, nav button.active { color: white; background: var(--nav-2); }
    nav svg { width: 18px; height: 18px; flex: none; }
    .nav-label { color: #6f9296; font-size: 11px; padding: 18px 12px 8px; letter-spacing: .12em; }
    .aside-foot { position: absolute; bottom: 18px; left: 16px; right: 16px; border-top: 1px solid #2e5157; padding-top: 15px; color: #8faeb1; font-size: 12px; }
    main { min-width: 0; padding: 24px 28px 48px; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 18px; }
    h1 { font-size: 24px; margin: 0 0 5px; letter-spacing: -.02em; }
    h2 { font-size: 17px; margin: 0; }
    h3 { font-size: 14px; margin: 0; }
    .sub, .muted { color: var(--muted); }
    .head-actions, .inline, .tabs, .segmented { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn { border: 1px solid var(--line); background: white; color: var(--ink); padding: 8px 13px; border-radius: 8px; font-weight: 600; }
    .btn:hover { border-color: #91b4b2; }
    .btn.primary { color: white; background: var(--teal); border-color: var(--teal); }
    .btn.danger { color: white; background: var(--red); border-color: var(--red); }
    .btn.small { padding: 6px 9px; font-size: 12px; }
    .btn.ghost { background: transparent; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 1px 0 rgba(20,40,45,.02); }
    .section { padding: 18px; margin-bottom: 14px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .views { display: flex; gap: 4px; overflow-x: auto; padding: 5px; margin-bottom: 12px; }
    .views button, .tabs button, .segmented button { white-space: nowrap; border: 0; background: transparent; color: var(--muted); padding: 8px 12px; border-radius: 7px; }
    .views button.active, .segmented button.active { color: var(--teal); background: var(--teal-soft); font-weight: 700; }
    .tabs { border-bottom: 1px solid var(--line); gap: 2px; margin: 0 -18px 18px; padding: 0 18px; overflow-x: auto; flex-wrap: nowrap; }
    .tabs button { border-radius: 0; padding: 10px 12px; border-bottom: 2px solid transparent; }
    .tabs button.active { color: var(--teal); border-color: var(--teal); font-weight: 700; }
    .attention { display: grid; grid-template-columns: repeat(5, minmax(140px,1fr)); gap: 10px; margin-bottom: 14px; }
    .attention button { background: white; border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; text-align: left; color: var(--ink); }
    .attention button:hover, .attention button.active { border-color: #82aaa6; box-shadow: var(--shadow); }
    .attention strong { font-size: 20px; margin-right: 4px; }
    .attention small { display: block; color: var(--muted); margin-top: 4px; }
    .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .search { border: 1px solid var(--line); border-radius: 8px; background: white; padding: 9px 11px; min-width: 260px; }
    .filter-chip { background: var(--teal-soft); color: var(--teal); border: 0; padding: 7px 9px; border-radius: 999px; }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 970px; }
    th { text-align: left; color: var(--muted); font-size: 12px; background: #f7f9fa; padding: 11px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    td { padding: 13px 12px; border-bottom: 1px solid #edf0f1; vertical-align: middle; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f8fbfb; }
    .task-name { font-weight: 700; margin-bottom: 4px; }
    .task-meta { color: var(--muted); font-size: 12px; }
    .tag { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 4px 8px; font-size: 12px; font-weight: 650; white-space: nowrap; }
    .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .tag.green { color: var(--green); background: var(--green-soft); }
    .tag.amber { color: var(--amber); background: var(--amber-soft); }
    .tag.red { color: var(--red); background: var(--red-soft); }
    .tag.blue { color: var(--blue); background: #e9f0f8; }
    .progress { height: 7px; width: 110px; background: #e7edef; overflow: hidden; border-radius: 9px; margin: 5px 0 3px; }
    .progress > i { display: block; height: 100%; background: var(--teal); border-radius: inherit; }
    .metric-grid { display: grid; grid-template-columns: repeat(6, minmax(110px,1fr)); gap: 10px; margin-bottom: 14px; }
    .metric { padding: 14px; background: white; border: 1px solid var(--line); border-radius: 10px; }
    .metric strong { display: block; font-size: 22px; margin: 7px 0 3px; }
    .metric small { color: var(--muted); }
    .breadcrumb { border: 0; background: none; color: var(--teal); padding: 0; margin-bottom: 13px; }
    .summary-strip { display: flex; gap: 22px; flex-wrap: wrap; padding: 13px 16px; margin-bottom: 14px; }
    .summary-strip span { color: var(--muted); font-size: 12px; }
    .summary-strip strong { display: block; color: var(--ink); font-size: 14px; margin-top: 4px; }
    .tracks { overflow-x: auto; padding: 20px 18px; }
    .track { display: grid; grid-template-columns: 84px repeat(7, minmax(100px,1fr)); align-items: center; min-width: 900px; margin-bottom: 16px; }
    .track:last-child { margin-bottom: 0; }
    .track-label { font-weight: 750; color: var(--muted); }
    .node { position: relative; text-align: center; padding-top: 27px; font-size: 12px; color: var(--muted); }
    .node::before { content: ""; position: absolute; top: 7px; left: calc(50% - 7px); width: 12px; height: 12px; border: 2px solid #a9b7bc; border-radius: 50%; background: white; z-index: 2; }
    .node::after { content: ""; height: 2px; background: #ccd5d8; position: absolute; top: 14px; left: -50%; right: 50%; }
    .node:first-of-type::after { display: none; }
    .node.done::before { background: var(--teal); border-color: var(--teal); }
    .node.done::after, .node.current::after { background: var(--teal); }
    .node.current { color: var(--ink); font-weight: 750; }
    .node.current::before { border: 4px solid var(--teal); width: 10px; height: 10px; box-shadow: 0 0 0 4px var(--teal-soft); }
    .node.risk::before { border-color: var(--amber); background: var(--amber-soft); border-radius: 2px; transform: rotate(45deg); }
    .node small { display: block; margin-top: 3px; color: #89959b; font-weight: 400; }
    .two-col { display: grid; grid-template-columns: minmax(0,1.65fr) minmax(280px,.8fr); gap: 14px; }
    .list { display: grid; gap: 9px; }
    .action { display: grid; grid-template-columns: 1fr auto; gap: 12px; border: 1px solid var(--line); border-radius: 9px; padding: 12px; }
    .action.done { opacity: .62; }
    .action-title { font-weight: 700; margin-bottom: 5px; }
    .timeline { min-width: 950px; }
    .timeline-row { display: grid; grid-template-columns: 220px 1fr 110px; gap: 14px; align-items: center; padding: 15px 12px; border-bottom: 1px solid var(--line); }
    .rail { height: 8px; background: #e7edef; border-radius: 8px; position: relative; }
    .rail .fill { height: 100%; background: var(--teal); border-radius: inherit; }
    .rail .mark { position: absolute; top: -8px; width: 2px; height: 24px; background: var(--red); }
    .rail .dot { position: absolute; top: -4px; width: 15px; height: 15px; border: 3px solid white; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
    .panel-grid { display: grid; grid-template-columns: minmax(280px,.9fr) minmax(0,1.3fr); gap: 14px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
    input, select, textarea { border: 1px solid var(--line); border-radius: 7px; padding: 9px; background: white; color: var(--ink); }
    textarea { min-height: 76px; resize: vertical; }
    .notice { padding: 11px 13px; border-radius: 8px; background: var(--amber-soft); color: #7a4b0b; border: 1px solid #efcf94; margin: 12px 0; }
    .notice.good { background: var(--green-soft); color: var(--green); border-color: #b7dcc7; }
    .bar-row { display: grid; grid-template-columns: 120px 1fr 50px; gap: 10px; align-items: center; margin: 13px 0; }
    .hbar { height: 12px; background: #e8edef; border-radius: 8px; overflow: hidden; }
    .hbar i { display: block; height: 100%; background: var(--blue); }
    .splitbar { display: flex; height: 24px; border-radius: 7px; overflow: hidden; margin: 12px 0; color: white; font-size: 11px; font-weight: 700; }
    .splitbar span { display: grid; place-items: center; min-width: 32px; }
    .pass { background: var(--green); } .reject { background: var(--red); } .pending { background: #aab4b8; }
    dialog { border: 0; border-radius: 14px; padding: 0; width: min(520px, calc(100% - 30px)); box-shadow: 0 28px 80px rgba(10,30,35,.26); }
    dialog::backdrop { background: rgba(13,31,35,.52); }
    .modal { padding: 20px; }
    .modal .form-grid { margin: 18px 0; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #172f34; color: white; padding: 11px 15px; border-radius: 9px; box-shadow: var(--shadow); z-index: 80; opacity: 0; transform: translateY(8px); pointer-events: none; transition: .18s; }
    .toast.show { opacity: 1; transform: none; }
    .empty { padding: 48px; text-align: center; color: var(--muted); }
    .mobile-nav { display: none; }
    @media (max-width: 1000px) {
      .app { grid-template-columns: 76px minmax(0,1fr); }
      aside { padding-inline: 8px; } .brand div:last-child, nav span, .nav-label, .aside-foot { display:none; }
      .brand { justify-content: center; padding-inline: 0; } nav button { justify-content: center; }
      .attention { grid-template-columns: repeat(3,1fr); } .metric-grid { grid-template-columns: repeat(3,1fr); }
      .two-col, .panel-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 680px) {
      .app { display: block; } aside { display: none; } main { padding: 16px 12px 82px; }
      .page-head { display: block; } .head-actions { margin-top: 12px; }
      .attention { grid-template-columns: 1fr 1fr; } .metric-grid { grid-template-columns: 1fr 1fr; }
      .search { min-width: 100%; } .form-grid { grid-template-columns: 1fr; }
      .mobile-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; display: grid; grid-template-columns: 1fr 1fr; background: white; border-top: 1px solid var(--line); padding: 7px; }
      .mobile-nav button { border: 0; background: white; padding: 8px; color: var(--muted); }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <a class="skip" href="#content">跳到主要内容</a>
  <div class="app">
    <aside>
      <div class="brand"><div class="brand-mark">QC</div><div><strong>质检一站式平台</strong><small>Quality Operations</small></div></div>
      <nav aria-label="主导航">
        <div class="nav-label">人工质检</div>
        <button class="active" data-nav="delivery" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v14H4zM8 3v4m8-4v4M7 11h4m-4 4h7"/></svg><span>交付中心</span></button>
        <button data-nav="acceptance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18H6zM9 8h6m-6 4h6m-6 4h3"/></svg><span>验收中心</span></button>
        <div class="nav-label">其他模块</div>
        <button disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 12h16M12 4v16"/></svg><span>自动化质检</span></button>
        <button disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8"/><path d="M9 12h6"/></svg><span>大模型质检</span></button>
      </nav>
      <div class="aside-foot">静态交互原型 · 示例数据<br>最近刷新 10:32</div>
    </aside>
    <main id="content" tabindex="-1" data-testid="page-root"></main>
  </div>
  <div class="mobile-nav"><button data-nav="delivery">交付中心</button><button data-nav="acceptance">验收中心</button></div>
  <dialog id="actionDialog" aria-labelledby="dialogTitle">
    <form class="modal" method="dialog" id="actionForm">
      <div class="section-head"><div><h2 id="dialogTitle">新增行动项</h2><div class="sub">挂载到当前交付任务并进入跟踪队列</div></div><button class="btn small" value="cancel" aria-label="关闭">关闭</button></div>
      <div class="form-grid">
        <label style="grid-column:1/-1">行动项标题<input name="title" required value="补齐夜间场景规则示例"></label>
        <label>责任人<input name="owner" required value="王敏"></label>
        <label>截止时间<input name="due" type="date" required value="2026-07-05"></label>
        <label>所属阶段<select name="stage"><option>规则对齐</option><option>数据准备</option><option>生产</option><option>标注</option><option>验收</option></select></label>
        <label>风险等级<select name="risk"><option>普通</option><option selected>较高</option><option>紧急</option></select></label>
      </div>
      <div class="head-actions" style="justify-content:flex-end"><button class="btn" value="cancel">取消</button><button class="btn primary" value="default" id="saveAction">创建行动项</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const $ = (s, root=document) => root.querySelector(s);
    const $$ = (s, root=document) => [...root.querySelectorAll(s)];
    const state = { page: 'delivery', deliveryView: 'table', deliveryFilter: '', acceptanceView: 'progress', detailTab: 'overview', acceptanceTab: 'overview', preview: false };
    const tasks = [
      {id:'D-0721', name:'车内多模态指令集 · 第三批', meta:'智舱专题 / 62,400 条', stage:'标注进行中', due:'07-12', predicted:'07-13', progress:68, acceptance:0, health:'risk', healthText:'有延期风险', actions:3, next:'跟进夜班增员', owner:'陈卓'},
      {id:'D-0718', name:'道路异常事件识别 · 七月批次', meta:'行车专题 / 38,120 条', stage:'生产阻塞', due:'07-08', predicted:'07-10', progress:32, acceptance:0, health:'blocked', healthText:'视频生产阻塞', actions:2, next:'确认预筛口径', owner:'李乔'},
      {id:'D-0712', name:'导航问答事实性评测集', meta:'座舱问答 / 18,600 条', stage:'待验收分配', due:'07-06', predicted:'07-06', progress:100, acceptance:12, health:'watch', healthText:'待分配', actions:1, next:'分配验收任务', owner:'王敏'},
      {id:'D-0706', name:'儿童安全场景描述集', meta:'安全专题 / 9,800 条', stage:'返修第 1 轮', due:'07-05', predicted:'07-07', progress:100, acceptance:100, health:'risk', healthText:'返修影响交付', actions:4, next:'跟踪返修完成', owner:'周宁'},
      {id:'D-0701', name:'泊车障碍物描述 · 二期', meta:'泊车专题 / 24,000 条', stage:'验收进行中', due:'07-09', predicted:'07-09', progress:100, acceptance:74, health:'healthy', healthText:'按计划', actions:0, next:'查看验收进度', owner:'赵新'}
    ];
    const icons = { healthy:'green', risk:'amber', watch:'blue', blocked:'red' };
    const app = $('#content');
    function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2200); }
    function setPage(page, opts={}) { state.page=page; Object.assign(state,opts); location.hash=page; render(); window.scrollTo({top:0}); }
    function tag(task){ return `<span class="tag ${icons[task.health]}">${task.healthText}</span>`; }
    function pageHead(title, sub, actions=''){ return `<header class="page-head"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="head-actions">${actions}</div></header>`; }
    function navSync(){ $$('[data-nav]').forEach(b=>{ const active=(state.page.startsWith(b.dataset.nav)||(state.page==='detail'&&b.dataset.nav==='delivery')||(state.page==='acceptance-workspace'&&b.dataset.nav==='acceptance')); b.classList.toggle('active',active); if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current'); }); }
    function deliveryPage(){
      const shown=tasks.filter(t=>!state.deliveryFilter || `${t.name}${t.healthText}${t.stage}`.includes(state.deliveryFilter));
      const viewButtons=`<div class="segmented" role="tablist" aria-label="展示模式"><button data-view="table" class="${state.deliveryView==='table'?'active':''}" aria-selected="${state.deliveryView==='table'}">表格</button><button data-view="timeline" class="${state.deliveryView==='timeline'?'active':''}" aria-selected="${state.deliveryView==='timeline'}">时间轴</button></div><button class="btn primary" id="newDelivery">＋ 新建交付任务</button>`;
      return pageHead('人工质检交付中心','把数据集从需求登记一直盯到验收通过',viewButtons)+`
      <section class="card views" aria-label="保存视图"><button class="active">全部 24</button><button>我的 8</button><button>我关注的 11</button><button>七月重点 9</button><button>未来两周 P0 6</button><button>周二需求会 7</button></section>
      <section class="attention" data-testid="attention-queue">
        ${[['待对齐',6,'规则与排期'],['数据未就绪',3,'影响 2 个 P0'],['行动项临期',7,'其中逾期 2 项'],['生产阻塞',1,'已持续 6 小时'],['交付风险',4,'未来 7 天']].map(([n,c,s])=>`<button data-filter="${n}" class="${state.deliveryFilter===n?'active':''}"><strong>${c}</strong>${n}<small>${s}</small></button>`).join('')}
      </section>
      <section class="card section">
        <div class="toolbar"><input class="search" id="deliverySearch" aria-label="搜索交付任务" placeholder="搜索后按 Enter 筛选" value="${state.deliveryFilter}"><button class="btn" id="applySearch">搜索</button><button class="btn">负责人：全部</button><button class="btn">目标交付：未来 30 天</button>${state.deliveryFilter?`<button class="filter-chip" id="clearFilter">${state.deliveryFilter} ×</button>`:''}<span class="muted" style="margin-left:auto">展示 ${shown.length} / ${tasks.length} 条 · 10:32 更新</span></div>
        ${state.deliveryView==='table'?deliveryTable(shown):deliveryTimeline(shown)}
      </section>`;
    }
    function deliveryTable(rows){ return `<div class="table-wrap" data-testid="delivery-table"><table><thead><tr><th>交付任务</th><th>当前节点</th><th>目标 / 预计交付</th><th>标注进度</th><th>验收进度</th><th>健康状态</th><th>行动项</th><th>下一动作</th></tr></thead><tbody>${rows.map(t=>`<tr data-task="${t.id}" tabindex="0"><td><div class="task-name">${t.name}</div><div class="task-meta">${t.id} · ${t.meta} · ${t.owner}</div></td><td>${t.stage}</td><td><strong>${t.due}</strong> / <span class="${t.due!==t.predicted?'tag amber':''}">${t.predicted}</span></td><td><div class="progress"><i style="width:${t.progress}%"></i></div><small>${t.progress}%</small></td><td><div class="progress"><i style="width:${t.acceptance}%"></i></div><small>${t.acceptance}%</small></td><td>${tag(t)}</td><td>${t.actions?`<strong>${t.actions}</strong> 项待办`:'已清空'}</td><td><button class="btn small" data-open="${t.id}">${t.next} →</button></td></tr>`).join('')||`<tr><td colspan="8" class="empty">没有匹配的交付任务</td></tr>`}</tbody></table></div>`; }

    function bind(){

      $('#clearFilter')?.addEventListener('click',()=>{state.deliveryFilter='';render()});

      $('#applySearch')?.addEventListener('click',applySearch); $('#deliverySearch')?.addEventListener('keydown',e=>{if(e.key==='Enter')applySearch()});

      $$('[data-accept-tab]').forEach(b=>b.onclick=()=>{state.acceptanceTab=b.dataset.acceptTab;render()});
      $$('[data-go-tab]').forEach(b=>b.onclick=()=>{state.acceptanceTab=b.dataset.goTab;render()});

      $('#confirmPass')?.addEventListener('click',e=>{e.target.disabled=true;e.target.textContent='执行回查中…';toast('通过结论已提交，正在回查状态')});
      $('#manualReject')?.addEventListener('click',()=>toast('原型提示：实际页面将要求填写打回范围与原因'));
      $('#mockEdit')?.addEventListener('click',()=>toast('字段已进入编辑态（原型演示）')); $('#newDelivery')?.addEventListener('click',()=>toast('新建任务将采用分阶段表单'));
    }
    $('#actionForm').addEventListener('submit',e=>{ if(e.submitter?.id!=='saveAction')return; e.preventDefault(); const data=new FormData(e.currentTarget); $('#actionDialog').close(); toast(`已创建行动项：${data.get('title')}`); });
    window.addEventListener('hashchange',()=>{ if(['delivery','acceptance'].includes(location.hash.slice(1))) setPage(location.hash.slice(1)); });
    render();
  </script>
</body>
</html>
